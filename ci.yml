name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Essencial: O SonarQube precisa do histórico completo do Git para funcionar direito

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'  # Acelera muito o CI, pois não baixa as dependências da internet toda vez

      - name: Permissão de execução para o Maven Wrapper
        run: chmod +x mvnw

      - name: Executar Testes (Unitários, E2E e VCR) e Cobertura JaCoCo
        # O verify garante que os testes rodem e o relatório de 80% do JaCoCo seja gerado
        run: ./mvnw -B -ntp clean verify

      - name: Análise de Qualidade no SonarQube
        # Só tenta rodar o Sonar se o token estiver configurado nos Secrets do GitHub
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: env.SONAR_TOKEN != ''
        run: ./mvnw -B -ntp sonar:sonar