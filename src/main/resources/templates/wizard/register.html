<!DOCTYPE html>
<html lang="pt-br"
xmlns:th="http://www.thymeleaf.org"
th:replace="~{layout :: html(~{::#content})}">

<body>

<div id="content">

<div class="form-container">

<div class="magic-card">

<h2>Registro de Bruxos</h2>

<form th:action="@{/wizards}"
th:object="${wizard}"
method="post">

<input type="text"
th:field="*{name}"
class="form-control"
placeholder="Nome do Bruxo">

<input type="email"
th:field="*{email}"
class="form-control"
placeholder="E-mail mágico">

<input type="password"
th:field="*{magicRegistration}"
class="form-control"
placeholder="Registro mágico">

<input type="text"
th:field="*{cep}"
class="form-control"
placeholder="CEP (Apenas números)"
maxlength="8"
style="margin-bottom: 5px;">
<small style="display: block; margin-bottom: 15px; text-align: left; opacity: 0.8;">
    Insira seu CEP para preenchimento automático do endereço.
</small>

<p th:if="${error}"
   th:text="${error}"
   style="color:red; margin-top:10px;">
</p>

<button type="submit"
class="magic-btn w-100">

Registrar Bruxo

</button>

</form>

</div>

</div>

</div>

</body>
</html>
