<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="html(content)">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hogwarts Library</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand"
           href="/">

            Hogwarts Library

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

           <ul class="navbar-nav ms-auto">

    <li class="nav-item">

        <a class="nav-link"
           href="/">

            Início

        </a>

    </li>

    <li class="nav-item">

        <a class="nav-link"
           href="/books">

            Livros

        </a>

    </li>

    <li class="nav-item"
        th:if="${session.loggedWizard != null
        and session.loggedWizard.admin}">

        <a class="nav-link"
           href="/wizards">

            Usuários

        </a>

    </li>

    <li class="nav-item"
        th:if="${session.loggedWizard == null}">

        <a class="nav-link"
           href="/login">

            Entrar

        </a>

    </li>

    <li class="nav-item"
        th:if="${session.loggedWizard == null}">

        <a class="nav-link"
           href="/wizards/register">

            Registrar

        </a>

    </li>

    <li class="nav-item"
        th:if="${session.loggedWizard != null}">

        <span class="nav-link">

            Olá,
            <span th:text="${session.loggedWizard.name}"></span>!

            <span th:if="${session.loggedWizard.admin}">
                (Admin)
            </span>

        </span>

    </li>

    <li class="nav-item"
        th:if="${session.loggedWizard != null}">

        <a class="nav-link text-warning fw-bold"
           th:href="@{/wizards/edit/{id}(id=${session.loggedWizard.id})}">

            Meu Perfil

        </a>

    </li>

    <li class="nav-item"
        th:if="${session.loggedWizard != null}">

        <a class="nav-link text-danger"
           href="/logout">

            Sair

        </a>

    </li>

</ul>

        </div>

    </div>

</nav>

<div th:replace="${content}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
